# Checks every pull request: type-check, build and link check.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from "packageManager" in package.json (works on any Node version)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm check
      - name: Build + link check (GitHub Pages base)
        run: pnpm build
      - name: Link check under a root base (custom domain readiness)
        run: |
          DOCS_BASE=/ pnpm exec astro build
          node scripts/check-links.mjs dist /
