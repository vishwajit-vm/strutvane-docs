# Builds every docs version, checks it, and publishes it to GitHub Pages.
#
# `npm run verify` is the gate: it builds each version (one Astro build per version, merged
# into dist/ with the redirects), checks every internal link and anchor across all versions,
# type-checks, and runs the tests (including tests on the built site). Any broken link or
# failing test fails this job, and nothing is deployed.
#
# One-time setup (done): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Actions are pinned by full commit SHA (resolved with `git ls-remote` on 2026-11-15).
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer run waits instead of cancelling one that is deploying.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every branch: a docs line can be read from its own branch
          # (`{ git: { ref: 'origin/0.2.x', path: 'content' } }` in docs.sources.ts).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build, link check and tests
        run: npm run verify
        env:
          # The Pages URL GitHub assigns (https://vishwajit-vm.github.io + /strutvane-docs).
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
